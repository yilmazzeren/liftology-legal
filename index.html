<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiftologyAI - Smart Workout Tracker</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --accent: #00e676;
      --border: #27272a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      padding: 24px;
      margin: 0;
      text-align: center;
    }
    .badge {
      color: var(--accent);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 36px;
      margin: 0 0 16px 0;
      color: #fff;
    }
    p {
      color: var(--muted);
      max-width: 520px;
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 36px;
    }
    .links {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn {
      background-color: var(--card);
      border: 1px solid var(--border);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="badge">Next-Gen Strength Training</div>
  <h1>LiftologyAI</h1>
  <p>AI-driven progressive overload, smart workout logging, and intelligent recovery tracking for dedicated lifters.</p>
  <div class="links">
    <a href="privacy.html" class="btn">Privacy Policy</a>
    <a href="terms.html" class="btn">Terms of Service</a>
  </div>
</body>
</html>
