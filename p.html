<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liftology AI — Antrenman Programı</title>
  
  <!-- Open Graph / WhatsApp Preview Tags -->
  <meta property="og:title" content="Liftology AI — Antrenman Programı">
  <meta property="og:description" content="Seninle bir antrenman programı paylaşıldı! Tek tıkla Liftology uygulamasına aktar.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Liftology AI">
  <meta name="theme-color" content="#09090b">

  <style>
    :root {
      --bg: #09090b;
      --card: #141416;
      --card-border: #222226;
      --accent: #00e676;
      --accent-glow: rgba(0, 230, 118, 0.25);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #27272a;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .container {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 40px var(--accent-glow);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-badge {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
      border: 1px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 20px;
      box-shadow: 0 0 24px var(--accent-glow);
    }
    .subtitle {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .program-pill {
      background: #1e1e24;
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .program-pill b {
      color: #fff;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      margin-bottom: 20px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      width: 100%;
    }
    .btn-primary {
      background: var(--accent);
      color: #000;
      box-shadow: 0 8px 24px var(--accent-glow);
    }
    .btn-primary:active {
      transform: scale(0.98);
      background: #00c853;
    }
    .btn-secondary {
      background: #27272a;
      color: #fff;
      border: 1px solid var(--border);
    }
    .btn-secondary:active {
      transform: scale(0.98);
      background: #3f3f46;
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      font-size: 14px;
      padding: 10px;
    }
    .hint {
      color: #71717a;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 8px;
    }
    .toast {
      position: fixed;
      bottom: 24px;
      background: #27272a;
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s ease;
      pointer-events: none;
      border: 1px solid var(--accent);
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo-badge">🏋️‍♂️</div>
    <div class="subtitle">Liftology AI</div>
    <h1 id="prog-title">Antrenman Programı</h1>
    
    <div class="program-pill" id="prog-badge">
      <span>Yükleniyor...</span>
    </div>

    <div class="actions">
      <a id="btn-open-app" href="liftology://" class="btn btn-primary">
        📲 Liftology'de Aç
      </a>
      <a href="https://apps.apple.com/app/id6818284488" class="btn btn-secondary" target="_blank">
        📥 App Store'dan İndir
      </a>
      <button id="btn-copy" class="btn btn-ghost">
        📋 Paylaşım Kodunu Kopyala
      </button>
    </div>

    <p class="hint">
      Liftology uygulaması yüklüyse yukarıdaki yeşil butona basarak programı doğrudan telefonuna aktarabilirsin.
    </p>
  </div>

  <div id="toast" class="toast">Kod Kopyalandı!</div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const dataParam = urlParams.get('d') || urlParams.get('data') || '';
      const deepLink = 'liftology://import-program?data=' + encodeURIComponent(dataParam);
      
      const btnOpen = document.getElementById('btn-open-app');
      btnOpen.href = deepLink;

      // Try automatic open immediately
      if (dataParam) {
        window.location.href = deepLink;
      }

      // Try decoding program title to display nicely on the page
      try {
        if (dataParam) {
          let base64 = dataParam.replace(/-/g, '+').replace(/_/g, '/');
          while (base64.length % 4 !== 0) base64 += '=';
          const binary = atob(base64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
          const jsonStr = new TextDecoder().decode(bytes);
          const parsed = JSON.parse(jsonStr);

          if (parsed.t) {
            document.getElementById('prog-title').innerText = parsed.t;
            const daysCount = Array.isArray(parsed.d) ? parsed.d.length : 0;
            document.getElementById('prog-badge').innerHTML = '<span>Plan: <b>' + daysCount + ' Günlük Antrenman</b></span>';
          } else if (parsed.title) {
            document.getElementById('prog-title').innerText = parsed.title;
            const daysCount = Array.isArray(parsed.days) ? parsed.days.length : 0;
            document.getElementById('prog-badge').innerHTML = '<span>Plan: <b>' + daysCount + ' Günlük Antrenman</b></span>';
          } else {
            document.getElementById('prog-badge').innerHTML = '<span>Özel Antrenman Planı</span>';
          }
        } else {
          document.getElementById('prog-badge').innerHTML = '<span>Liftology Antrenman Programı</span>';
        }
      } catch (e) {
        document.getElementById('prog-badge').innerHTML = '<span>Özel Antrenman Planı</span>';
      }

      // Copy code button
      document.getElementById('btn-copy').addEventListener('click', function() {
        const textToCopy = dataParam ? 'LIFTPROG:' + dataParam : window.location.href;
        navigator.clipboard.writeText(textToCopy).then(function() {
          const toast = document.getElementById('toast');
          toast.classList.add('show');
          setTimeout(() => toast.classList.remove('show'), 2000);
        });
      });
    })();
  </script>
</body>
</html>
